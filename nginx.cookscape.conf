# ==============================================================================
# COOKSCAPE PRODUCTION NGINX CONFIGURATION
# Location: /etc/nginx/sites-available/cookscape.conf
# Enable:   sudo ln -s /etc/nginx/sites-available/cookscape.conf /etc/nginx/sites-enabled/
# ==============================================================================

# Rate limit zone to protect /api/send-email from automated spam & bot flooding
limit_req_zone $binary_remote_addr zone=cookscape_email_limit:10m rate=5r/m;

server {
    listen 80;
    server_name cookscape.com www.cookscape.com; # Replace with your actual domain or IP

    # Path to Vite React production static build
    root /home/deploy/cookscape_newsite/dist;
    index index.html;

    # Maximum file upload size
    client_max_body_size 25M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip Compression for peak performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/js
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # 1. Single Page Application (SPA) Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Static Asset Caching (Images, Videos, Fonts, JS, CSS)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|ttf|otf|mp4|webm)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
        try_files $uri =404;
    }

    # 3. Rate-limited Email Dispatch API (Protects Gmail SMTP from Spam)
    location /api/send-email {
        limit_req zone=cookscape_email_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. General Backend API Proxy to Node.js (Port 5005)
    location /api/ {
        proxy_pass http://127.0.0.1:5005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Deny access to hidden files (.env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
