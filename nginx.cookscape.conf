server {
    listen 80;
    server_name cookscape.com www.cookscape.com; # Replace with your domain or IP

    # Maximum file upload size
    client_max_body_size 25M;

    # Frontend Static Files (Vite React Build)
    root /home/deploy/cookscape_newsite/dist;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Frontend SPA fallback routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API Reverse Proxy (Port 5005)
    location /api/ {
        proxy_pass http://127.0.0.1:5005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
